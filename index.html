<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLA Open Datasets — Impact Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    /* ─── TOKENS ───────────────────────────────────────────────────
       Public-site palette (2026-10 redesign). Intentionally diverges from
       /design/tokens.css — see README.md "Site design vs /design/". */
    :root {
      --ink:      #1D2733;   /* text, headings */
      --ink-2:    #3A4552;   /* strong secondary */
      --muted:    #5A6472;   /* meta, captions (6.0:1 on white) */
      --faint:    #8A93A0;   /* decorative only, never body text */
      --rule:     #E3E6EA;
      --rule-2:   #EEF0F2;
      --panel:    #F6F7F8;
      --bg:       #FFFFFF;

      --accent:    #0F766E;  /* TLA teal, deepened for text contrast */
      --accent-bg: #E8F3F1;

      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --sans:  'Montserrat', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    /* Dataset identity: a small dot, never a fill */
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--c, var(--faint)); flex-shrink: 0;
    }

    /* ─── HEADER ─── */
    header.top {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--rule);
    }
    .nav-main {
      max-width: 1120px; margin: 0 auto;
      padding: 0 1.5rem; height: 52px;
      display: flex; align-items: center; gap: 1.75rem;
    }
    .brand {
      font-family: var(--serif);
      font-weight: 600; font-size: 1.02rem;
      color: var(--ink); white-space: nowrap;
    }
    .brand:hover { text-decoration: none; }
    .nav-ds {
      display: flex; gap: 1.25rem; height: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav-ds::-webkit-scrollbar { display: none; }
    .nav-ds a {
      display: inline-flex; align-items: center; gap: 0.45rem;
      color: var(--muted); font-size: 0.78rem; font-weight: 500;
      white-space: nowrap; height: 100%;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .nav-ds a:hover { color: var(--ink); text-decoration: none; }
    .nav-ds a.active { color: var(--ink); border-bottom-color: var(--ink); }
    .nav-about {
      margin-left: auto;
      font-size: 0.78rem; font-weight: 500; color: var(--muted);
    }
    .nav-about:hover, .nav-about.active { color: var(--ink); text-decoration: none; }

    .nav-search-row {
      max-width: 1120px; margin: 0 auto;
      padding: 0 1.5rem 0.8rem;
    }
    .nav-search {
      width: 100%; display: block;
      padding: 0.6rem 0.9rem 0.6rem 2.35rem;
      border: 1px solid var(--rule); border-radius: 8px;
      background: var(--panel) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%235A6472'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z'/></svg>") no-repeat 0.85rem center / 15px 15px;
      font-family: inherit; font-size: 0.84rem; color: var(--ink);
      outline: none; transition: border-color 0.12s, background-color 0.12s;
    }
    .nav-search::placeholder { color: var(--muted); }
    .nav-search:focus { border-color: var(--accent); background-color: #fff; }

    /* ─── LAYOUT ─── */
    main { max-width: 1120px; margin: 0 auto; padding: 0 1.5rem 5rem; }
    .empty, .loading {
      text-align: center; padding: 3rem 2rem;
      color: var(--muted); font-size: 0.85rem;
    }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--rule); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .show-more { display: flex; justify-content: center; padding: 1.25rem 0 0; }
    .show-more button {
      font-family: inherit; font-size: 0.8rem; font-weight: 500;
      padding: 0.5rem 1.1rem; border-radius: 8px;
      border: 1px solid var(--rule); background: #fff;
      color: var(--ink-2); cursor: pointer;
    }
    .show-more button:hover { border-color: var(--ink-2); }
    .show-more .count { color: var(--muted); margin-left: 0.4rem; }

    /* ─── HOME: HEADLINE ─── */
    .hero { padding: 3.5rem 0 2.25rem; }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(1.75rem, 3.6vw, 2.6rem);
      font-weight: 600; line-height: 1.18;
      letter-spacing: -0.01em;
      max-width: 22em;
    }
    .hero h1 .sub { display: block; color: var(--muted); font-weight: 400; }
    .hero p {
      color: var(--muted); max-width: 40rem;
      font-size: 0.92rem; line-height: 1.7; margin-top: 1rem;
    }

    /* ─── SECTION HEADS ─── */
    .sec-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      margin: 3rem 0 0.9rem;
    }
    .sec-head h2 {
      font-family: var(--serif);
      font-size: 1.3rem; font-weight: 600; color: var(--ink);
    }
    .sec-head .meta { font-size: 0.78rem; color: var(--muted); }

    /* ─── CITATION LEDGER (home) ─── */
    .ledger { border-top: 1px solid var(--ink); }
    .ledger-head, .ledger-row {
      display: grid;
      grid-template-columns: minmax(170px, 1.2fr) minmax(200px, 2fr) minmax(150px, 1.3fr) 4.5rem;
      gap: 1.5rem; align-items: center;
    }
    .ledger-head {
      padding: 0.6rem 0;
      font-size: 0.74rem; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--rule);
    }
    .ledger-head .num { text-align: right; }
    .ledger-row {
      padding: 0.95rem 0;
      border-bottom: 1px solid var(--rule);
      color: inherit;
    }
    .ledger-row:hover { background: var(--panel); text-decoration: none; }
    .ledger-row:hover .lg-name { text-decoration: underline; text-underline-offset: 3px; }
    .lg-ds { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .lg-name { font-weight: 600; font-size: 0.92rem; color: var(--ink); }
    .lg-year { font-size: 0.74rem; color: var(--muted); margin-left: 0.15rem; }
    .lg-count { display: flex; align-items: center; gap: 0.85rem; }
    .lg-count .n {
      font-family: var(--serif); font-size: 1.45rem; font-weight: 600;
      line-height: 1; min-width: 2.2ch; text-align: right; color: var(--ink);
    }
    .lg-bar { flex: 1; height: 6px; background: var(--rule-2); border-radius: 3px; overflow: hidden; }
    .lg-bar span { display: block; height: 100%; background: var(--c); border-radius: 3px; }
    .lg-new { text-align: right; font-size: 0.82rem; font-weight: 600; color: var(--accent); }
    .lg-new.zero { color: var(--faint); font-weight: 500; }

    /* Use-mix bar: direct / reference / incidental in one dataset hue */
    .mix { display: flex; height: 10px; border-radius: 2px; overflow: hidden; background: var(--rule-2); }
    .mix span { display: block; height: 100%; }
    .mix .m-direct { background: var(--c); }
    .mix .m-ref    { background: color-mix(in srgb, var(--c) 50%, #fff); }
    .mix .m-inc    { background: color-mix(in srgb, var(--c) 22%, #fff); }
    .mix-legend {
      display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem;
      font-size: 0.74rem; color: var(--muted); margin-top: 0.55rem;
    }
    .mix-legend .sw {
      display: inline-block; width: 9px; height: 9px; border-radius: 2px;
      margin-right: 0.35rem; vertical-align: -1px;
    }
    .mix-legend b { color: var(--ink); font-weight: 600; }
    .ledger-key { margin-top: 0.7rem; --c: var(--ink-2); }

    /* ─── RECENT ADDITIONS ─── */
    .recent-list { border-top: 1px solid var(--rule); }
    .recent-row {
      display: grid; grid-template-columns: 9rem 1fr;
      gap: 1.25rem; padding: 0.85rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .recent-ds {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.76rem; font-weight: 600; color: var(--ink-2);
      padding-top: 0.2rem; white-space: nowrap;
    }
    .recent-ds:hover { color: var(--ink); }
    .recent-row .ttl {
      font-family: var(--serif); font-size: 1rem; font-weight: 500;
      color: var(--ink); line-height: 1.4;
    }
    .recent-row .ttl:hover { color: var(--accent); text-decoration: none; }
    .recent-row .sub { font-size: 0.76rem; color: var(--muted); margin-top: 0.2rem; }

    /* ─── FILTERS ─── */
    .filter-row {
      display: flex; align-items: center; gap: 0.75rem;
      flex-wrap: wrap; margin: 0 0 0.25rem;
      padding-bottom: 0.9rem;
    }
    .seg {
      display: inline-flex; border: 1px solid var(--rule);
      border-radius: 8px; padding: 2px; background: var(--panel);
      flex-wrap: wrap;
    }
    .pill {
      font-family: inherit; font-size: 0.78rem; font-weight: 500;
      padding: 0.36rem 0.8rem; border-radius: 6px;
      border: 0; background: transparent;
      color: var(--muted); cursor: pointer;
    }
    .pill:hover { color: var(--ink); }
    .pill.on { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
    .pill-search {
      margin-left: auto;
      padding: 0.42rem 0.75rem;
      border: 1px solid var(--rule); border-radius: 8px;
      background: #fff; font-family: inherit;
      font-size: 0.8rem; color: var(--ink); width: 210px;
      outline: none;
    }
    .pill-search::placeholder { color: var(--muted); }
    .pill-search:focus { border-color: var(--accent); }

    /* ─── DATASET PAGE HEADER ─── */
    .ds-header { padding: 2.25rem 0 0.5rem; }
    .back-link { display: inline-block; font-size: 0.78rem; color: var(--muted); margin-bottom: 1.25rem; }
    .back-link:hover { color: var(--ink); text-decoration: none; }
    .ds-title {
      display: flex; align-items: center; gap: 0.75rem;
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3.4vw, 2.5rem);
      font-weight: 600; line-height: 1.15; color: var(--ink);
    }
    .ds-title .dot { width: 12px; height: 12px; }
    .ds-desc {
      color: var(--ink-2); font-size: 0.92rem;
      line-height: 1.7; max-width: 44rem; margin-top: 0.85rem;
    }
    .ds-access { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 1.25rem; }
    .ds-access a {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.48rem 0.9rem;
      border: 1px solid var(--rule); border-radius: 8px;
      font-size: 0.8rem; font-weight: 600; color: var(--ink);
    }
    .ds-access a:hover { border-color: var(--ink-2); text-decoration: none; }
    .ds-access a .arrow { color: var(--muted); }
    .ds-access .license { font-size: 0.76rem; color: var(--muted); margin-left: 0.25rem; }

    .ds-stats { margin-top: 2.25rem; max-width: 44rem; }
    .ds-stats-line {
      font-family: var(--serif); font-size: 1.15rem; line-height: 1.5;
      color: var(--ink); margin-bottom: 0.75rem;
    }
    .ds-stats-line strong { font-weight: 600; }

    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%;
      border: 1px solid var(--faint); color: var(--muted);
      font-size: 9px; font-weight: 700; font-style: normal;
      font-family: var(--sans);
      cursor: help; position: relative; vertical-align: 1px;
      margin-left: 0.15rem;
    }
    .info-tip:hover, .info-tip:focus { border-color: var(--ink-2); color: var(--ink); }
    .info-tip::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      width: max-content; max-width: 280px;
      padding: 0.6rem 0.8rem;
      background: var(--ink); color: #F3F4F6;
      font-size: 0.74rem; font-weight: 400; line-height: 1.5;
      border-radius: 6px; white-space: normal; text-align: left;
      pointer-events: none; opacity: 0; transition: opacity 0.15s;
      z-index: 50;
    }
    .info-tip:hover::after, .info-tip:focus::after { opacity: 1; }
    .ledger-head .info-tip::after { font-weight: 400; }
    /* Hover note on ledger bars */
    .tip-host { position: relative; }
    .tip-host::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 6px); left: 0;
      width: max-content; max-width: 260px;
      padding: 0.45rem 0.65rem;
      background: var(--ink); color: #F3F4F6;
      font-size: 0.74rem; font-weight: 400; line-height: 1.45;
      border-radius: 6px; white-space: normal;
      pointer-events: none; opacity: 0; transition: opacity 0.12s; z-index: 50;
    }
    .ledger-row:hover .tip-host::after, .ledger-row:focus-visible .tip-host::after { opacity: 1; }

    /* ─── IMPACT SUMMARY ─── */
    .narrative {
      margin-top: 2rem; max-width: 44rem;
      padding: 0.2rem 0 0.2rem 1.25rem;
      border-left: 2px solid var(--c, var(--ink));
    }
    .narrative-lbl { font-size: 0.76rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; }
    .narrative-text {
      font-family: var(--serif); font-size: 1.02rem; line-height: 1.65;
      color: var(--ink); margin-bottom: 0.6rem;
    }

    /* ─── CITE DATASET ─── */
    .cite-block { margin-top: 2rem; max-width: 44rem; }
    .cite-lbl { font-size: 0.76rem; font-weight: 600; color: var(--muted); margin-bottom: 0.45rem; }
    .cite-text {
      font-family: var(--serif); font-size: 0.92rem; line-height: 1.6;
      color: var(--ink); background: var(--panel);
      padding: 0.8rem 1rem; border-radius: 8px;
      margin-bottom: 0.5rem; overflow-wrap: anywhere;
    }

    /* ─── PAPER LIST ─── */
    .papers-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 3rem 0 0.9rem; gap: 1rem; flex-wrap: wrap;
    }
    .papers-head h2 { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
    .papers { border-top: 1px solid var(--rule); }
    .paper {
      padding: 1.2rem 0 1.1rem;
      border-bottom: 1px solid var(--rule);
      scroll-margin-top: 130px;
    }
    .paper-head { display: flex; gap: 1.5rem; align-items: flex-start; }
    .paper-title {
      flex: 1; min-width: 0;
      font-family: var(--serif);
      font-size: 1.06rem; font-weight: 600; line-height: 1.4;
    }
    .paper-title a { color: var(--ink); }
    .paper-title a:hover { color: var(--accent); text-decoration: none; }
    .paper-side {
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem;
      flex-shrink: 0; padding-top: 0.15rem;
    }
    .paper-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }
    .paper-meta .authors { color: var(--ink-2); font-weight: 500; }
    .paper-ds {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.74rem; font-weight: 600; color: var(--ink-2); white-space: nowrap;
    }
    .paper-ds:hover { color: var(--ink); }
    .paper-takeaway {
      font-size: 0.86rem; color: var(--ink-2);
      line-height: 1.6; margin-top: 0.55rem; max-width: 52rem;
    }
    .new-tag { font-size: 0.72rem; font-weight: 600; color: var(--accent); }

    /* Strength meter: three dots, gray, with a plain-language label */
    .strength {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-size: 0.74rem; color: var(--muted); white-space: nowrap;
    }
    .strength .pips { display: inline-flex; gap: 3px; }
    .strength .pips i {
      width: 7px; height: 7px; border-radius: 50%;
      border: 1.5px solid var(--ink-2);
    }
    .strength .pips i.on { background: var(--ink-2); }
    .strength.flagged { color: #8A4B08; }

    .paper-actions { display: flex; gap: 1.1rem; align-items: center; margin-top: 0.7rem; }
    .btn-action {
      font-family: inherit; font-size: 0.76rem; font-weight: 500;
      padding: 0.15rem 0; border: 0; background: none;
      color: var(--muted); cursor: pointer;
    }
    .btn-action:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .btn-action.copied { color: var(--accent); }
    .narrative .btn-action, .cite-block .btn-action { color: var(--accent); }

    .paper-detail {
      margin-top: 0.85rem; padding: 1rem 1.15rem;
      background: var(--panel); border-radius: 8px;
    }
    .detail-list { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.6rem 1.25rem; }
    .detail-list dt { font-size: 0.76rem; font-weight: 600; color: var(--muted); padding-top: 0.12rem; }
    .detail-list dd { font-size: 0.84rem; line-height: 1.6; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
    .citation { font-family: var(--serif); font-size: 0.92rem; line-height: 1.6; }
    .abstract { font-size: 0.84rem; line-height: 1.7; }

    .paper.deep-linked { padding-left: 1rem; box-shadow: inset 2px 0 0 var(--accent); background: linear-gradient(90deg, var(--accent-bg), transparent 60%); }

    /* ─── EXPORT ─── */
    .export-wrap { position: relative; display: inline-block; }
    .export-btn {
      font-family: inherit; font-size: 0.8rem; font-weight: 500;
      padding: 0.42rem 0.85rem; border-radius: 8px;
      border: 1px solid var(--rule); background: #fff;
      color: var(--ink-2); cursor: pointer;
    }
    .export-btn:hover { border-color: var(--ink-2); }
    .export-menu {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      background: #fff; border: 1px solid var(--rule); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(29, 39, 51, 0.08);
      min-width: 180px; z-index: 30; overflow: hidden;
    }
    .export-menu.open { display: block; }
    .export-menu button {
      display: flex; align-items: center; gap: 0.5rem;
      width: 100%; padding: 0.6rem 0.9rem;
      font-family: inherit; font-size: 0.8rem;
      background: none; border: none; color: var(--ink);
      cursor: pointer; text-align: left;
    }
    .export-menu button:hover { background: var(--panel); }
    .export-menu .meta { font-size: 0.74rem; color: var(--muted); margin-left: auto; }

    /* ─── SEARCH VIEW ─── */
    .search-head { padding: 2.25rem 0 0.5rem; }
    .search-head h2 { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; }
    .search-head .meta { font-size: 0.82rem; color: var(--muted); margin-top: 0.25rem; }
    .search-group { margin-top: 2.25rem; }
    .search-group-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.6rem; }
    .search-group-name {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--serif); font-size: 1.15rem; font-weight: 600; color: var(--ink);
    }
    .search-group-count { font-size: 0.78rem; color: var(--muted); }

    /* ─── ABOUT ─── */
    .about-page { max-width: 44rem; padding: 2.5rem 0 4rem; }
    .about-page h1 { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; line-height: 1.2; margin-bottom: 0.75rem; }
    .about-page .lede { font-family: var(--serif); color: var(--ink-2); font-size: 1.12rem; line-height: 1.65; margin-bottom: 2.25rem; }
    .about-page h2 { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; margin: 2.25rem 0 0.6rem; }
    .about-page p { font-size: 0.9rem; line-height: 1.75; margin-bottom: 0.85rem; }
    .about-page ul { margin: 0.4rem 0 1rem 1.25rem; font-size: 0.9rem; line-height: 1.75; }
    .about-page li { margin-bottom: 0.4rem; }
    .about-page code { font-size: 0.82rem; background: var(--panel); padding: 0.08rem 0.35rem; border-radius: 4px; }
    .about-page .source-table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1.5rem; font-size: 0.86rem; }
    .about-page .source-table th, .about-page .source-table td {
      padding: 0.65rem 0.75rem 0.65rem 0; text-align: left;
      border-bottom: 1px solid var(--rule); vertical-align: top;
    }
    .about-page .source-table th { font-size: 0.76rem; font-weight: 600; color: var(--muted); border-bottom-color: var(--ink); }
    .about-page .source-table td:first-child { white-space: nowrap; }
    .about-page .meta-row { font-size: 0.78rem; color: var(--muted); margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 860px) {
      .ledger-head { display: none; }
      .ledger-row {
        grid-template-columns: 1fr auto;
        grid-template-areas: "ds new" "count count" "mix mix";
        gap: 0.55rem 1rem;
      }
      .lg-ds { grid-area: ds; }
      .lg-new { grid-area: new; }
      .lg-count { grid-area: count; }
      .lg-mix { grid-area: mix; }
    }
    @media (max-width: 720px) {
      .nav-main { padding: 0.55rem 1rem 0; gap: 0 1rem; height: auto; flex-wrap: wrap; }
      .nav-ds { order: 3; width: 100%; height: 38px; gap: 1.1rem; }
      .nav-search-row { padding: 0 1rem 0.7rem; }
      main { padding: 0 1rem 3rem; }
      .hero { padding: 2.25rem 0 1.5rem; }
      .recent-row { grid-template-columns: 1fr; gap: 0.3rem; }
      .paper-head { flex-direction: column; gap: 0.4rem; }
      .paper-side { flex-direction: row; align-items: center; gap: 0.9rem; }
      .pill-search { margin-left: 0; width: 100%; }
      .detail-list { grid-template-columns: 1fr; gap: 0.2rem 0; }
      .detail-list dt { margin-top: 0.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header class="top">
  <nav class="nav-main">
    <a href="#/" class="brand">TLA Impact Tracker</a>
    <div class="nav-ds" id="navDs"></div>
    <a href="#/about" class="nav-about" id="navAboutLink">About</a>
  </nav>
  <div class="nav-search-row">
    <input class="nav-search" id="navSearch" placeholder="Search papers, authors, institutions, or topics" aria-label="Search all papers" oninput="onSearchInput(this.value)" autocomplete="off">
  </div>
</header>

<main id="app">
  <div class="loading"><span class="spinner"></span>Loading…</div>
</main>

<script>
// ── STATE ─────────────────────────────────────────────────────────
const cache = {};
let meta = null;
let allPapersCache = null;
let _crossFilter = 'all';
let _crossShowAll = false;
const CROSS_LIMIT = 30;
let _dsFilter = 'all';
let _dsSearch = '';
let _dsPapers = [];

// ── ESCAPE ────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ── FETCHERS ──────────────────────────────────────────────────────
async function fetchJSON(path) {
  if (cache[path]) return cache[path];
  const res = await fetch(path);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
  cache[path] = await res.json();
  return cache[path];
}
async function loadMeta() {
  if (meta) return meta;
  meta = await fetchJSON('./data/metadata.json');
  return meta;
}
async function loadDataset(id) {
  return fetchJSON(`./data/${id}.json`);
}
async function loadAllPapers() {
  if (allPapersCache) return allPapersCache;
  const m = await loadMeta();
  const datasets = await Promise.all(
    m.datasets.map(d => loadDataset(d.id).catch(() => null))
  );
  const all = [];
  datasets.forEach((data, i) => {
    if (!data) return;
    const ds = m.datasets[i];
    (data.papers || []).forEach(p => all.push({ ...p, _ds: ds }));
  });
  allPapersCache = all;
  return all;
}

// ── ROUTING ───────────────────────────────────────────────────────
function getRoute() {
  const h = location.hash || '#/';
  if (h.startsWith('#/about')) return { page: 'about' };
  if (h.startsWith('#/dataset/')) {
    const after = h.slice(10);
    const [id, qstr] = after.split('?');
    const params = new URLSearchParams(qstr || '');
    return { page: 'dataset', id, paper: params.get('paper') || null };
  }
  if (h.startsWith('#/search')) {
    const qstr = h.split('?')[1] || '';
    const q = decodeURIComponent((qstr.match(/(?:^|&)q=([^&]*)/) || [,''])[1]);
    return { page: 'search', q };
  }
  return { page: 'home' };
}
async function route() {
  const r = getRoute();
  try {
    if (r.page === 'dataset')      await renderDataset(r.id, r.paper);
    else if (r.page === 'search')  await renderSearch(r.q);
    else if (r.page === 'about')   await renderAbout();
    else                           await renderHome();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="loading">Failed to load.<br><small>${esc(e.message)}</small></div>`;
  }
}

// ── NAV ───────────────────────────────────────────────────────────
function buildNav(activeId) {
  const m = meta;
  if (!m) return;
  document.getElementById('navDs').innerHTML = m.datasets.map(d => {
    const isActive = d.id === activeId;
    return `<a href="#/dataset/${esc(d.id)}" class="${isActive ? 'active' : ''}"${isActive ? ' aria-current="page"' : ''}><span class="dot" style="--c:${esc(d.color)}"></span>${esc(d.display_name)}</a>`;
  }).join('');
  const r = getRoute();
  const ns = document.getElementById('navSearch');
  if (ns && r.page !== 'search' && !ns.matches(':focus')) ns.value = '';
  const aboutLink = document.getElementById('navAboutLink');
  if (aboutLink) aboutLink.classList.toggle('active', r.page === 'about');
}

let _searchTimer = null;
function onSearchInput(val) {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    if (val.trim().length < 2) {
      if (location.hash.startsWith('#/search')) location.hash = '#/';
      return;
    }
    const q = encodeURIComponent(val.trim());
    if (!location.hash.startsWith(`#/search?q=${q}`)) {
      location.hash = `#/search?q=${q}`;
    }
  }, 220);
}

// ── ABOUT ─────────────────────────────────────────────────────────
async function renderAbout() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';
  const m = await loadMeta();
  buildNav(null);

  const total = m.datasets.reduce((s, d) => s + (d.citation_count || 0), 0);

  app.innerHTML = `
    <div class="about-page">
      <h1>About this tracker</h1>
      <p class="lede">
        The TLA Open Datasets Impact Tracker monitors how The Learning Agency's open datasets
        — PERSUADE&nbsp;2.0, PIILO, KLiCKe, ASAP&nbsp;2.0, AIDE, and Jo&nbsp;Wilder — are cited
        in academic research. As of ${esc(monthName(m.last_updated))}, the tracker covers
        <strong>${total} citing papers</strong> across <strong>${m.datasets.length} datasets</strong>.
      </p>

      <h2>How citations are discovered</h2>
      <p>
        Each month, an automated sweep queries Google Scholar's
        "Cited by" page for each dataset's anchor paper and extracts the full list of
        citing works. Where available, paper metadata (full citation, authors,
        institutions, country) is enriched via the OpenAlex API and arXiv. For datasets
        without a peer-reviewed anchor paper, citations are tracked via search on the
        dataset's DOI or Kaggle URL.
      </p>
      <p>
        Discovery is intentionally generous: Google Scholar surfaces more citations
        than indexed-journal databases (it covers preprints, theses, and conference
        papers), at the cost of some false positives. The review step (below) filters those out.
      </p>

      <h2>How papers are reviewed</h2>
      <p>
        New citing papers go through a two-stage review before appearing on the site:
      </p>
      <ul>
        <li><strong>AI pre-judgment.</strong> For each paper, an LLM reads the abstract
          and assigns: a connection level (direct use / reference / incidental), a 1–2 sentence
          interpretive takeaway, and a short research-type label. Papers with weak or
          unclear connections are flagged for manual review rather than auto-approved.</li>
        <li><strong>Human review.</strong> A TLA team member reviews AI suggestions,
          adjusts where needed, and approves or rejects each paper before it lands on
          this site. Rejected papers are remembered to prevent re-surfacing next sweep.</li>
      </ul>

      <h2>What the connection levels mean</h2>
      <table class="source-table">
        <thead><tr><th>Level</th><th>Meaning</th></tr></thead>
        <tbody>
          <tr><td><strong>Direct use</strong></td><td>The paper directly uses the dataset for training, evaluation, or experiments. The abstract typically names it explicitly.</td></tr>
          <tr><td><strong>Reference</strong></td><td>The paper references the dataset for comparison, builds on closely related methods, or treats it as a sister-resource — without using it as the experimental subject.</td></tr>
          <tr><td><strong>Incidental</strong></td><td>The paper mentions the dataset peripherally — survey, related-work list, or background — with no substantive engagement.</td></tr>
        </tbody>
      </table>

      <h2>Honest caveats</h2>
      <ul>
        <li>The reviewer LLM sees only the abstract, not the full paper. Where an abstract doesn't name the dataset by name, the strength label is a hedged inference from topic + the fact that GS placed the paper in the "Cited by" cluster.</li>
        <li>Reproducibility: a different LLM run on the same abstract should produce the same bucket, but borderline reference/incidental cases are genuinely uncertain. Human reviewers correct these on a per-paper basis.</li>
        <li>The Direct use / Reference / Incidental counts are interpretive groupings derived from these judgments, not verified counts. In the raw data they are stored as <code>connection_strength</code> = strong / moderate / weak.</li>
        <li>Google Scholar's "Cited by" lists are imperfect — they miss some citations and include some false positives. We rely on them as the discovery starting point, not the source of truth.</li>
      </ul>

      <h2>Open source + reproducibility</h2>
      <p>
        The site code, dataset metadata, and citation records are open at
        <a href="https://github.com/jchoi92k/TLA-Impact-Tracker" target="_blank">github.com/jchoi92k/TLA-Impact-Tracker</a>.
        Each per-paper JSON record exposes its provenance: <code>abstract_source</code>
        (openalex / arxiv_api / page_meta / manual), <code>metadata_source</code>
        (gs_scrape / tracker_pdf / manual), and <code>first_tracked</code> (which monthly sweep first added the paper).
      </p>

      <h2>Cite or reuse data from this site</h2>
      <p>
        Each dataset page includes a "Cite this dataset" block. The raw paper records
        are available in JSON at <code>/data/&lt;dataset-id&gt;.json</code> — feel free
        to fetch them for your own analyses. If you build something on top of this
        tracker, drop us a note.
      </p>

      <div class="meta-row">
        Data last refreshed ${esc(monthName(m.last_updated) || '—')}. Next update due ${esc(monthName(m.next_sweep_due) || '—')}.
        Maintained by The Learning Agency.
      </div>
    </div>
  `;
}

// ── HOME ──────────────────────────────────────────────────────────
async function renderHome() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';
  const m = await loadMeta();
  buildNav(null);

  const all = await loadAllPapers();
  const lastSweep = m.last_sweep_date;
  const total = all.length;
  const added = all.filter(p => p.first_tracked === lastSweep).length;
  const dsWord = NUM_WORDS[m.datasets.length] || m.datasets.length;

  app.innerHTML = `
    <div class="hero">
      <h1>${total} research papers cite TLA’s ${dsWord} open datasets.
        ${added ? `<span class="sub">${added} were added in ${esc(monthName(lastSweep))}.</span>` : ''}</h1>
      <p>We track every paper Google Scholar lists as citing PERSUADE 2.0, PIILO, KLiCKe, ASAP 2.0, AIDE, or Jo Wilder, then review how closely each one engages with the data. Updated monthly.</p>
    </div>

    <div class="ledger" role="table" aria-label="Citations by dataset">
      <div class="ledger-head" role="row">
        <span role="columnheader">Dataset</span>
        <span role="columnheader">Citing papers</span>
        <span role="columnheader">How they use it <span class="info-tip" tabindex="0" role="note" aria-label="${USE_TIP}" data-tip="${USE_TIP}">i</span></span>
        <span role="columnheader" class="num">New</span>
      </div>
      ${ledgerRows(m, all)}
    </div>
    <div class="mix-legend ledger-key">
      <span><span class="sw" style="background:var(--ink-2)"></span>Direct use</span>
      <span><span class="sw" style="background:color-mix(in srgb, var(--ink-2) 50%, #fff)"></span>Reference</span>
      <span><span class="sw" style="background:color-mix(in srgb, var(--ink-2) 22%, #fff)"></span>Incidental mention</span>
      <span>New = added in the ${esc(monthName(lastSweep))} update</span>
    </div>

    <div class="sec-head">
      <h2>Recently added</h2>
      <a class="meta" href="javascript:void(0)" onclick="crossFilt('new', document.querySelector('[data-f=new]')); document.getElementById('crossHead').scrollIntoView({behavior:'smooth'})">See all ${added} from ${esc(monthName(lastSweep))}</a>
    </div>
    <div id="recentList" class="recent-list"></div>

    <div class="sec-head" id="crossHead">
      <h2>All papers</h2>
      <span class="meta" id="crossMeta"></span>
    </div>
    <div class="filter-row">
      <div class="seg" role="group" aria-label="Filter papers">
        <button class="pill on" data-f="all" onclick="crossFilt('all', this)">All</button>
        <button class="pill" data-f="new" onclick="crossFilt('new', this)">New this month</button>
        <button class="pill" data-f="strong" onclick="crossFilt('strong', this)">Direct use</button>
        <button class="pill" data-f="moderate" onclick="crossFilt('moderate', this)">Reference</button>
        <button class="pill" data-f="weak" onclick="crossFilt('weak', this)">Incidental</button>
      </div>
    </div>
    <div id="crossList" class="papers"></div>
  `;

  _crossFilter = 'all';
  renderRecent();
  renderCross();
}

// ── SHARED HELPERS (labels, counts, bars) ─────────────────────────
const NUM_WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthName(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(ym || '');
  return m ? `${MONTHS[+m[2] - 1]} ${m[1]}` : (ym || '');
}
// Public labels for the internal connection_strength values
const STRENGTH = {
  strong:   { label: 'Direct use', pips: 3 },
  moderate: { label: 'Reference',  pips: 2 },
  weak:     { label: 'Incidental', pips: 1 },
};
function strengthMeter(p) {
  if (p.status === 'flagged') return '<span class="strength flagged">Under review</span>';
  const s = STRENGTH[p.connection_strength];
  if (!s) return '';
  const pips = [1, 2, 3].map(i => `<i class="${i <= s.pips ? 'on' : ''}"></i>`).join('');
  return `<span class="strength" title="Connection: ${s.label}"><span class="pips" aria-hidden="true">${pips}</span>${s.label}</span>`;
}
function useCounts(papers) {
  const c = { strong: 0, moderate: 0, weak: 0 };
  papers.forEach(p => { if (c[p.connection_strength] != null) c[p.connection_strength]++; });
  return c;
}
function mixBar(c, color, label) {
  const n = c.strong + c.moderate + c.weak;
  if (!n) return '<div class="mix"></div>';
  const pct = v => (v / n * 100).toFixed(2) + '%';
  return `<div class="mix" style="--c:${esc(color)}" role="img" aria-label="${esc(label || '')}: ${c.strong} direct use, ${c.moderate} reference, ${c.weak} incidental">
    <span class="m-direct" style="width:${pct(c.strong)}"></span><span class="m-ref" style="width:${pct(c.moderate)}"></span><span class="m-inc" style="width:${pct(c.weak)}"></span>
  </div>`;
}

const USE_TIP = 'Each bar splits a dataset’s citing papers by how closely they engage with it. Dark: direct use (trains, evaluates, or experiments on the data). Medium: reference (compares against or builds on it). Light: incidental (a passing mention). Judged from each abstract and reviewed by TLA staff.';
function mixTip(c, n) {
  return `${c.strong} of ${n} use it directly, ${c.moderate} reference it, ${c.weak} mention it in passing`;
}

function ledgerRows(m, all) {
  const byDs = {};
  all.forEach(p => (byDs[p._ds.id] ??= []).push(p));
  const rows = m.datasets.map(d => {
    const papers = byDs[d.id] || [];
    return { d, papers, n: papers.length, added: papers.filter(p => p.first_tracked === m.last_sweep_date).length };
  }).sort((a, b) => b.n - a.n);
  const max = Math.max(1, ...rows.map(r => r.n));
  return rows.map(({ d, papers, n, added }) => `
    <a class="ledger-row" role="row" href="#/dataset/${esc(d.id)}" style="--c:${esc(d.color)}">
      <span class="lg-ds" role="cell"><span class="dot"></span><span class="lg-name">${esc(d.display_name)}</span><span class="lg-year">${esc(d.published_year || '')}</span></span>
      <span class="lg-count" role="cell"><span class="n">${n}</span><span class="lg-bar"><span style="width:${(n / max * 100).toFixed(2)}%"></span></span></span>
      <span class="lg-mix tip-host" role="cell" data-tip="${esc(mixTip(useCounts(papers), n))}">${mixBar(useCounts(papers), d.color, d.display_name)}</span>
      <span class="lg-new ${added ? '' : 'zero'}" role="cell">${added ? '+' + added : '0'}</span>
    </a>`).join('');
}

function renderRecent() {
  const el = document.getElementById('recentList');
  if (!el || !allPapersCache) return;
  // Sort by first_tracked (most recent first), break ties by year desc
  const sorted = allPapersCache.slice().sort((a, b) => {
    const ta = a.first_tracked || ''; const tb = b.first_tracked || '';
    if (ta !== tb) return tb.localeCompare(ta);
    return (b.year || 0) - (a.year || 0);
  });
  // Up to two papers per dataset from the newest update, so every dataset with
  // new citations is represented. Within a dataset, direct uses lead, then
  // papers with a DOI (usually peer-reviewed). Datasets with the most new papers go first.
  const newest = sorted[0]?.first_tracked;
  const rank = { strong: 0, moderate: 1, weak: 2 };
  const PER_DS = 2;
  const byDs = {};
  sorted.filter(p => p.first_tracked === newest).forEach(p => (byDs[p._ds?.id] ??= []).push(p));
  const recent = Object.values(byDs)
    .sort((a, b) => b.length - a.length)
    .flatMap(list => list.slice().sort((a, b) =>
      ((rank[a.connection_strength] ?? 3) - (rank[b.connection_strength] ?? 3)) ||
      ((b.doi ? 1 : 0) - (a.doi ? 1 : 0))
    ).slice(0, PER_DS));
  if (!recent.length) {
    el.innerHTML = '<div class="empty">No papers yet.</div>';
    return;
  }

  el.innerHTML = recent.map(p => {
    const ds = p._ds;
    const authors = Array.isArray(p.authors) ? p.authors : [];
    const who = authors.length > 2 ? `${authors[0]} et al.` : authors.join(' and ');
    const sub = [who, p.venue].filter(Boolean).join(', ');
    return `
      <div class="recent-row">
        <a class="recent-ds" href="#/dataset/${esc(ds?.id || '')}" style="--c:${esc(ds?.color || '')}"><span class="dot"></span>${esc(ds?.display_name || '')}</a>
        <div>
          <a class="ttl" href="#/dataset/${esc(ds?.id || '')}?paper=${esc(p.id)}">${esc(p.title || 'Untitled')}</a>
          ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function crossFilt(val, btn) {
  _crossFilter = val;
  _crossShowAll = false;  // reset expansion when filter changes
  document.querySelectorAll('#app .seg .pill').forEach(b => b.classList.remove('on'));
  btn?.classList.add('on');
  renderCross();
}

function crossShowAll() {
  _crossShowAll = true;
  renderCross();
}

function renderCross() {
  const el = document.getElementById('crossList');
  const metaEl = document.getElementById('crossMeta');
  if (!el || !allPapersCache) return;
  const lastSweep = meta?.last_sweep_date;

  let list = allPapersCache.slice();
  if (_crossFilter === 'strong')   list = list.filter(p => p.connection_strength === 'strong');
  else if (_crossFilter === 'moderate') list = list.filter(p => p.connection_strength === 'moderate');
  else if (_crossFilter === 'weak')     list = list.filter(p => p.connection_strength === 'weak');
  else if (_crossFilter === 'new')      list = list.filter(p => p.first_tracked === lastSweep);

  list.sort((a, b) => (b.year || 0) - (a.year || 0));
  const total = list.length;
  const truncated = !_crossShowAll && total > CROSS_LIMIT;
  if (truncated) list = list.slice(0, CROSS_LIMIT);

  if (metaEl) {
    metaEl.textContent = truncated
      ? `${CROSS_LIMIT} most recent of ${total}`
      : `${total} ${total === 1 ? 'paper' : 'papers'}`;
  }

  if (list.length === 0) {
    el.innerHTML = '<div class="empty">No papers match this filter.</div>';
    return;
  }
  const more = truncated
    ? `<div class="show-more"><button onclick="crossShowAll()">Show all<span class="count">${total - CROSS_LIMIT} more</span></button></div>`
    : '';
  el.innerHTML = list.map((p, i) => paperCard(p, `c${i}`, true)).join('') + more;
}

// ── DATASET PAGE ──────────────────────────────────────────────────
async function renderDataset(id, focusPaperId) {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';

  const [m, data] = await Promise.all([loadMeta(), loadDataset(id)]);
  buildNav(id);

  const cfg = m.datasets.find(d => d.id === id) || {};
  const color = cfg.color || 'var(--ink-2)';
  const s = data.summary || {};
  _dsPapers = data.papers || [];
  _dsFilter = 'all';
  _dsSearch = '';

  // Dataset access buttons (Kaggle / DOI / license)
  const accessLinks = [];
  if (cfg.kaggle_url) {
    accessLinks.push(`<a href="${esc(cfg.kaggle_url)}" target="_blank">Get the dataset on Kaggle <span class="arrow">↗</span></a>`);
  }
  if (cfg.paper_doi) {
    accessLinks.push(`<a href="https://doi.org/${esc(cfg.paper_doi)}" target="_blank">Read the paper <span class="arrow">↗</span></a>`);
  }
  if (cfg.license) {
    accessLinks.push(`<span class="license">License: ${esc(cfg.license)}</span>`);
  }
  const accessHTML = accessLinks.length
    ? `<div class="ds-access">${accessLinks.join('')}</div>`
    : '';

  const flagged = _dsPapers.filter(p => p.status === 'flagged').length;
  const name = data.meta?.display_name || id;
  const c = useCounts(_dsPapers);
  const n = _dsPapers.length;
  const tip = `Judged from each paper&#39;s abstract. Direct use: the paper trains, evaluates, or experiments on ${esc(name)}. Reference: it compares against or builds on ${esc(name)} without using it directly. Incidental: a passing mention in a survey or related-work section. These are interpretive judgments, reviewed by TLA staff.`;

  app.innerHTML = `
    <div class="ds-header" style="--c:${esc(color)}">
      <a href="#/" class="back-link">← All datasets</a>
      <h1 class="ds-title"><span class="dot"></span>${esc(name)}</h1>
      <div class="ds-desc">${esc(data.meta?.description || '')}</div>
      ${accessHTML}

      <div class="ds-stats">
        <div class="ds-stats-line"><strong>${n} ${n === 1 ? 'paper cites' : 'papers cite'} ${esc(name)}.</strong>
          ${c.strong} ${c.strong === 1 ? 'uses' : 'use'} it directly, ${c.moderate} ${c.moderate === 1 ? 'references' : 'reference'} it, and ${c.weak} ${c.weak === 1 ? 'mentions' : 'mention'} it in passing.</div>
        ${mixBar(c, color, name)}
        <div class="mix-legend">
          <span><span class="sw" style="background:${esc(color)}"></span>Direct use <b>${c.strong}</b></span>
          <span><span class="sw" style="background:color-mix(in srgb, ${esc(color)} 50%, #fff)"></span>Reference <b>${c.moderate}</b></span>
          <span><span class="sw" style="background:color-mix(in srgb, ${esc(color)} 22%, #fff)"></span>Incidental <b>${c.weak}</b></span>
          <span class="info-tip" tabindex="0" role="note" aria-label="${tip}" data-tip="${tip}">i</span>
          ${flagged ? `<span>Under review <b>${flagged}</b></span>` : ''}
        </div>
      </div>

      <div class="narrative">
        <div class="narrative-lbl">Impact summary</div>
        <div class="narrative-text" id="narrativeText"></div>
        <button class="btn-action" onclick="copyNarrative(this)">Copy summary</button>
      </div>
      ${citeBlockHTML(cfg)}
    </div>

    <div class="papers-head">
      <h2>Citing papers</h2>
    </div>
    <div class="filter-row">
      <div class="seg" role="group" aria-label="Filter papers">
        <button class="pill on" onclick="dsFilt('all', this)">All ${n}</button>
        <button class="pill" onclick="dsFilt('strong', this)">Direct use</button>
        <button class="pill" onclick="dsFilt('moderate', this)">Reference</button>
        <button class="pill" onclick="dsFilt('weak', this)">Incidental</button>
        ${flagged ? `<button class="pill" onclick="dsFilt('flagged', this)">Under review ${flagged}</button>` : ''}
      </div>
      <input class="pill-search" type="search" placeholder="Search these papers" aria-label="Search these papers" oninput="dsSrch(this.value)">
      <div class="export-wrap">
        <button class="export-btn" aria-haspopup="true" onclick="toggleExportMenu(event)">Export</button>
        <div class="export-menu" id="exportMenu">
          <button onclick="exportDataset('${esc(id)}','csv')">CSV <span class="meta">.csv</span></button>
          <button onclick="exportDataset('${esc(id)}','bibtex')">BibTeX <span class="meta">.bib</span></button>
          <button onclick="exportDataset('${esc(id)}','json')">Raw JSON <span class="meta">.json</span></button>
        </div>
      </div>
    </div>
    <div id="dsList" class="papers"></div>
  `;

  document.getElementById('narrativeText').textContent = generateNarrative(cfg, data);
  renderDsPapers();

  // Deep-link: if route specified ?paper=ID, scroll to + flash-highlight it
  if (focusPaperId) {
    setTimeout(() => focusPaper(focusPaperId), 60);
  }

  // Close export menu on outside click
  document.addEventListener('click', closeExportMenuOnOutsideClick);
}

function citeBlockHTML(cfg) {
  // Only show the cite block when we have a real, useful citation string.
  // No fallbacks — pointing people at "use Zotero on this DOI" wasn't helpful.
  // The "Read the paper" button at the top of the page already exposes the DOI.
  if (!cfg.citation_string) return '';
  return `
    <div class="cite-block">
      <div class="cite-lbl">Cite this dataset</div>
      <div class="cite-text">${esc(cfg.citation_string)}</div>
      <button class="btn-action" onclick="copyCiteBlock(this)">Copy citation</button>
    </div>
  `;
}

function copyCiteBlock(btn) {
  const txt = btn.parentElement.querySelector('.cite-text')?.textContent || '';
  copyText(txt.trim(), btn);
}

function focusPaper(paperId) {
  const cards = document.querySelectorAll('#dsList .paper');
  let target = null;
  cards.forEach(c => { if (c.dataset.paperId === paperId) target = c; });
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('deep-linked');
  // Auto-expand the detail panel if not already open
  const detail = target.querySelector('.paper-detail');
  const toggleBtn = target.querySelector('.btn-action');
  if (detail && detail.style.display === 'none' && toggleBtn) toggleBtn.click();
  // Flash highlight fades after 4s
  setTimeout(() => target.classList.remove('deep-linked'), 4000);
}

function generateNarrative(cfg, data) {
  const s = data.summary || {};
  const papers = data.papers || [];
  const total = s.total_citations || papers.length;
  const years = papers.map(p => p.year).filter(Boolean).sort((a, b) => a - b);
  const yr = years.length
    ? (years[0] === years[years.length-1] ? `${years[0]}` : `${years[0]}–${years[years.length-1]}`)
    : null;
  const direct = s.directly_used, ref = s.reference_comparison, inc = s.incidental_peripheral;

  // Opening sentence: include year-range only when we have publication years
  const timesWord = total === 1 ? 'time' : 'times';
  let blurb = yr
    ? `${cfg.display_name} has been cited ${total} ${timesWord} across ${yr}.`
    : `${cfg.display_name} has been cited ${total} ${timesWord}.`;

  const parts = [];
  if (direct) parts.push(`${direct} ${direct === 1 ? 'paper uses' : 'papers use'} the dataset directly`);
  // Lead with "paper(s)" only in the first clause; later clauses read as a list
  const lead = (n, one, many) => `${n} ${parts.length ? '' : (n === 1 ? 'paper ' : 'papers ')}${n === 1 ? one : many}`;
  if (ref)    parts.push(lead(ref, 'references it for benchmarking or comparison', 'reference it for benchmarking or comparison'));
  if (inc)    parts.push(lead(inc, 'is an incidental mention', 'are incidental mentions'));
  if (parts.length) blurb += ` ${parts.join('; ')}.`;

  // Most-represented countries first (paper count, then name)
  const counts = {};
  papers.forEach(p => (p.country || []).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
  const countries = (s.countries || []).slice()
    .sort((a, b) => (counts[b] || 0) - (counts[a] || 0) || a.localeCompare(b));
  if (countries.length) {
    const top = countries.slice(0, 6);
    blurb += ` Research originates from ${countries.length} ${countries.length === 1 ? 'country' : 'countries'} (${top.join(', ')}${countries.length > 6 ? ', and others' : ''}).`;
  }
  // NOTE: summary.note is an internal annotation field (e.g. "Tracked via two
  // GS clusters", "First sweep pending") and is intentionally NOT included in
  // the public-facing narrative.
  return blurb;
}

function copyNarrative(btn) {
  const txt = document.getElementById('narrativeText')?.textContent || '';
  copyText(txt, btn);
}

function dsFilt(val, btn) {
  _dsFilter = val;
  document.querySelectorAll('#app .seg .pill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderDsPapers();
}
function dsSrch(val) {
  _dsSearch = val.toLowerCase();
  renderDsPapers();
}
function renderDsPapers() {
  const el = document.getElementById('dsList');
  if (!el) return;
  let list = _dsPapers;
  if (_dsFilter === 'flagged') list = list.filter(p => p.status === 'flagged');
  else if (_dsFilter !== 'all') list = list.filter(p => p.connection_strength === _dsFilter);
  if (_dsSearch) list = list.filter(p => matchesQuery(p, _dsSearch));
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">No papers match this filter.</div>';
    return;
  }
  el.innerHTML = list.map((p, i) => paperCard(p, `d${i}`, false)).join('');
}

// ── SEARCH VIEW ───────────────────────────────────────────────────
async function renderSearch(query) {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><span class="spinner"></span>Searching…</div>';
  await loadMeta();
  buildNav(null);
  const ns = document.getElementById('navSearch');
  if (ns) ns.value = query;

  const all = await loadAllPapers();
  const q = query.toLowerCase();
  const matches = all.filter(p => matchesQuery(p, q));

  const groups = {};
  matches.forEach(p => {
    const id = p._ds?.id || 'unknown';
    (groups[id] ??= []).push(p);
  });

  let html = `
    <div class="search-head">
      <h2>Results for “${esc(query)}”</h2>
      <div class="meta">${matches.length} ${matches.length === 1 ? 'result' : 'results'} across ${Object.keys(groups).length} ${Object.keys(groups).length === 1 ? 'dataset' : 'datasets'}</div>
    </div>
  `;

  if (matches.length === 0) {
    html += '<div class="empty">No matching papers. Try a different query.</div>';
  } else {
    for (const ds of meta.datasets) {
      const list = groups[ds.id];
      if (!list?.length) continue;
      html += `
        <div class="search-group">
          <div class="search-group-head">
            <a href="#/dataset/${esc(ds.id)}" class="search-group-name" style="--c:${esc(ds.color)}"><span class="dot"></span>${esc(ds.display_name)}</a>
            <span class="search-group-count">${list.length} ${list.length === 1 ? 'match' : 'matches'}</span>
          </div>
          <div class="papers">${list.map((p, i) => paperCard(p, `s${ds.id}${i}`, false)).join('')}</div>
        </div>
      `;
    }
  }
  app.innerHTML = html;
}

function matchesQuery(p, q) {
  if (!q) return true;
  const fields = [
    p.title, p.venue, p.abstract,
    p.key_takeaway, p.research_type,
    Array.isArray(p.authors) ? p.authors.join(' ') : p.authors,
    Array.isArray(p.institutions) ? p.institutions.join(' ') : p.institutions,
    Array.isArray(p.country) ? p.country.join(' ') : p.country,
    p.full_citation, p.doi,
  ];
  const blob = fields.filter(Boolean).join(' ').toLowerCase();
  return q.split(/\s+/).every(term => blob.includes(term));
}

// ── PAPER CARD ────────────────────────────────────────────────────
// Takeaways open with "Strong/Moderate/Weak connection." for reviewers in the
// tracker; the public site shows the level as a meter instead, so drop it here.
function publicTakeaway(s) {
  return String(s).replace(/^\s*(strong|moderate|weak)\s+connection\s*[.:—-]\s*/i, '');
}

function paperCard(p, key, showDs) {
  const lastSweep = meta?.last_sweep_date;
  const isNew = !!(lastSweep && p.first_tracked === lastSweep);

  const dsBadge = (showDs && p._ds)
    ? `<a href="#/dataset/${esc(p._ds.id)}" class="paper-ds" style="--c:${esc(p._ds.color)}"><span class="dot"></span>${esc(p._ds.display_name)}</a>`
    : '';

  const newPill = isNew ? '<span class="new-tag">New</span>' : '';

  const authors = Array.isArray(p.authors) ? p.authors.join(', ') : (p.authors || '');
  const venueParts = [p.venue, p.year].filter(Boolean);

  const hasDetail = p.full_citation || p.abstract || p.gs_link ||
    (Array.isArray(p.institutions) && p.institutions.length) ||
    (Array.isArray(p.also_cites) && p.also_cites.length);

  const titleHTML = p.doi
    ? `<a href="https://doi.org/${esc(p.doi)}" target="_blank">${esc(p.title || 'Untitled')}</a>`
    : esc(p.title || 'Untitled');

  // dataset id for the permalink button — try _ds (cross-context) then fall
  // back to p.dataset (set on per-dataset papers)
  const dsIdForLink = p._ds?.id || p.dataset || '';

  return `
    <div class="paper" id="p-${key}" data-paper-id="${esc(p.id)}">
      <div class="paper-head">
        <div style="flex:1;min-width:0">
          <h3 class="paper-title">${titleHTML}</h3>
          <div class="paper-meta">
            ${authors ? `<span class="authors">${esc(authors)}</span>` : ''}${authors && venueParts.length ? '. ' : ''}${venueParts.length ? esc(venueParts.join(', ')) : ''}
          </div>
        </div>
        <div class="paper-side">${strengthMeter(p)}${dsBadge}${newPill}</div>
      </div>
      ${p.key_takeaway ? `<div class="paper-takeaway">${esc(publicTakeaway(p.key_takeaway))}</div>` : ''}
      ${hasDetail ? `
        <div class="paper-actions">
          <button class="btn-action" onclick="toggleDetail('${key}', this)">Show details</button>
          ${p.full_citation ? `<button class="btn-action" onclick="copyCitation('${key}', this)">Copy citation</button>` : ''}
          ${dsIdForLink ? `<button class="btn-action btn-permalink" onclick="copyPermalink('${esc(dsIdForLink)}','${esc(p.id)}', this)">Copy link</button>` : ''}
        </div>
        <div class="paper-detail" id="d-${key}" style="display:none">
          ${paperDetail(p, key)}
        </div>
      ` : ''}
    </div>
  `;
}

function paperDetail(p, key) {
  const rows = [];
  if (p.full_citation) {
    rows.push(['Citation', `<div class="citation" id="cite-${key}">${esc(p.full_citation)}</div>`]);
  }
  if (p.venue) rows.push(['Venue', esc(p.venue)]);
  if (p.research_type) rows.push(['Research type', esc(p.research_type)]);
  if (Array.isArray(p.institutions) && p.institutions.length) {
    rows.push(['Institutions', p.institutions.map(esc).join('; ')]);
  }
  if (Array.isArray(p.country) && p.country.length) {
    rows.push(['Countries', p.country.map(esc).join(', ')]);
  }
  if (Array.isArray(p.also_cites) && p.also_cites.length) {
    rows.push(['Also cites', p.also_cites.map(c =>
      `<a href="#/dataset/${esc(c)}">${esc(c.toUpperCase())}</a>`).join(' · ')]);
  }
  const links = [];
  if (p.doi)      links.push(`<a href="https://doi.org/${esc(p.doi)}" target="_blank">DOI ↗</a>`);
  if (p.gs_link)  links.push(`<a href="${esc(p.gs_link)}" target="_blank">Open paper ↗</a>`);
  if (links.length) rows.push(['Links', links.join(' · ')]);
  if (p.abstract) {
    rows.push(['Abstract', `<div class="abstract">${esc(p.abstract)}</div>`]);
  }
  if (!rows.length) return '<div class="empty">No additional details.</div>';
  return `<dl class="detail-list">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

function toggleDetail(key, btn) {
  const el = document.getElementById(`d-${key}`);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  btn.textContent = open ? 'Show details' : 'Hide details';
}

function copyCitation(key, btn) {
  const el = document.getElementById(`cite-${key}`);
  if (el) copyText(el.textContent, btn);
}

// ── EXPORT (CSV / BibTeX / JSON) ──────────────────────────────────
function toggleExportMenu(e) {
  e.stopPropagation();
  document.getElementById('exportMenu')?.classList.toggle('open');
}
function closeExportMenuOnOutsideClick(e) {
  const menu = document.getElementById('exportMenu');
  if (menu && !e.target.closest('.export-wrap')) menu.classList.remove('open');
}

function downloadBlob(content, mime, filename) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  document.getElementById('exportMenu')?.classList.remove('open');
}

function csvCell(v) {
  if (v == null) return '';
  if (Array.isArray(v)) v = v.join('; ');
  const s = String(v);
  // Always quote — safer when fields contain commas, newlines, quotes.
  return '"' + s.replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
}

function exportDataset(dsId, format) {
  const cfg = meta?.datasets.find(d => d.id === dsId);
  const papers = _dsPapers || [];
  const date = new Date().toISOString().slice(0, 10);
  const safeName = dsId.replace(/[^a-z0-9_-]/gi, '_');

  if (format === 'csv') {
    const cols = ['id','title','authors','year','venue','doi','connection_strength',
                  'research_type','key_takeaway','also_cites','first_tracked','gs_link'];
    const lines = [cols.map(csvCell).join(',')];
    for (const p of papers) {
      lines.push(cols.map(c => csvCell(p[c])).join(','));
    }
    downloadBlob(lines.join('\n'), 'text/csv', `${safeName}-citations-${date}.csv`);
  }
  else if (format === 'bibtex') {
    const entries = papers.map(p => {
      const key = (p.id || 'paper').replace(/[^a-z0-9_-]/gi, '_');
      const type = p.doi ? '@article' : '@misc';
      const fields = [];
      if (p.authors) {
        const auths = Array.isArray(p.authors) ? p.authors.join(' and ') : p.authors;
        fields.push(`  author    = {${auths}}`);
      }
      if (p.title)  fields.push(`  title     = {${p.title}}`);
      if (p.venue)  fields.push(`  journal   = {${p.venue}}`);
      if (p.year)   fields.push(`  year      = {${p.year}}`);
      if (p.doi)    fields.push(`  doi       = {${p.doi}}`);
      if (p.gs_link && !p.doi) fields.push(`  url       = {${p.gs_link}}`);
      return `${type}{${key},\n${fields.join(',\n')}\n}`;
    });
    const header = `% ${cfg?.display_name || dsId} — citations exported from TLA Impact Tracker (${date})\n% ${papers.length} entries\n\n`;
    downloadBlob(header + entries.join('\n\n') + '\n', 'application/x-bibtex', `${safeName}-citations-${date}.bib`);
  }
  else if (format === 'json') {
    // Just stream the raw data file the user can already access
    const payload = JSON.stringify({ dataset: dsId, exported: date, papers }, null, 2);
    downloadBlob(payload, 'application/json', `${safeName}-citations-${date}.json`);
  }
}

// ── PERMALINK (deep-link to a paper) ──────────────────────────────
function copyPermalink(dsId, paperId, btn) {
  // copyText handles the .copied class + button-text flash; just build URL
  const url = `${location.origin}${location.pathname}#/dataset/${dsId}?paper=${paperId}`;
  copyText(url, btn);
}

function copyText(text, btn) {
  if (!text) return;
  const done = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1400);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { /* swallow */ }
  document.body.removeChild(ta);
}

// ── INIT ──────────────────────────────────────────────────────────
window.addEventListener('hashchange', route);
route();
